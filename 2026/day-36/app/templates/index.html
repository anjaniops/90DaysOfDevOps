<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Tracker — Dockerized</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; background: #0f172a; color: #e2e8f0; }
  h1 { color: #38bdf8; }
  input { padding: 8px; width: 70%; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; cursor: pointer; font-weight: 600; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin: 6px 0; background: #1e293b; border-radius: 6px; }
  .done { text-decoration: line-through; opacity: 0.5; }
  .del { background: #ef4444; color: white; }
</style>
</head>
<body>
  <h1>📋 Task Tracker (Flask + Postgres, Dockerized)</h1>
  <input id="title" placeholder="New task..." />
  <button onclick="addTask()">Add</button>
  <ul id="list"></ul>

<script>
async function load() {
  const res = await fetch('/api/tasks');
  const tasks = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  tasks.forEach(t => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="${t.done ? 'done' : ''}" onclick="toggle(${t.id})">${t.title}</span>
                     <button class="del" onclick="del(${t.id})">x</button>`;
    list.appendChild(li);
  });
}
async function addTask() {
  const input = document.getElementById('title');
  if (!input.value.trim()) return;
  await fetch('/api/tasks', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title: input.value}) });
  input.value = '';
  load();
}
async function toggle(id) {
  await fetch('/api/tasks/' + id, { method: 'PUT' });
  load();
}
async function del(id) {
  await fetch('/api/tasks/' + id, { method: 'DELETE' });
  load();
}
load();
</script>
</body>
</html>
